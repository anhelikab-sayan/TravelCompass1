{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
{% block body %}
<h2>Вход</h2>

<form method="post">
  {% csrf_token %}

  <input name="username" placeholder="Логин" value="{{ username|default:'' }}" required>
  <input name="password" type="password" placeholder="Пароль" required>

  <button type="submit">Войти</button>
</form>
{% endblock %}
