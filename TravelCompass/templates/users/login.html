{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
{% block body %}
<h2>Вход</h2>

{% if error %}
  <ul style="color: red;">
    <li>{{ error }}</li>
  </ul>
{% endif %}

<form method="post">
  {% csrf_token %}

  <input name="username" placeholder="Логин" value="{{ username|default:'' }}" required>
  <input name="password" type="password" placeholder="Пароль" required>

  <button type="submit">Войти</button>
</form>
{% endblock %}
