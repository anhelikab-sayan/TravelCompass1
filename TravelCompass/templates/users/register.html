{% extends "base.html" %}
{% block body %}
<h2>Регистрация</h2>

{% if errors %}
  <ul style="color: red;">
    {% for error in errors %}
      <li>{{ error }}</li>
    {% endfor %}
  </ul>
{% endif %}

{% if success %}
  <p style="color: green;">{{ success }}</p>
{% endif %}

<form method="post">
  {% csrf_token %}

  <input name="username" placeholder="Логин" value="{{ username|default:'' }}" required>
  <input name="email" type="email" placeholder="Email" value="{{ email|default:'' }}" required>

  <input name="password" type="password" placeholder="Пароль" required>
  <input name="password2" type="password" placeholder="Повторите пароль" required>

  <button type="submit">Создать аккаунт</button>
</form>
{% endblock %}
