{% extends "base.html" %}

{% block content %}
<h2>Поиск мест</h2>

<form method="get" style="margin-bottom: 20px;">
    <input
        type="text"
        name="q"
        placeholder="Кофейня, парк..."
        value="{{ query }}"
    >

    <input type="text"
       name="city"
       placeholder="Город (Москва, Berlin, Tokyo...)"
       value="{{ city }}">


    <select name="category">
        <option value="">Любая категория</option>
        <option value="cafe" {% if category == "cafe" %}selected{% endif %}>Кофейни</option>
        <option value="park" {% if category == "park" %}selected{% endif %}>Парки</option>
        <option value="restaurant" {% if category == "restaurant" %}selected{% endif %}>Рестораны</option>
    </select>

    <button type="submit">Искать</button>
</form>

{% if city %}
    <p>Найдено мест: {{ places_json|length }}</p>
{% endif %}

<div id="map"></div>

<style>
#map {
    width: 100%;
    height: 400px;
    border-radius: 12px;
    margin-top: 20px;
}
</style>

<script src="https://maps.api.2gis.ru/2.0/loader.js?pkg=full"></script>

<script>
DG.then(function () {

    let places = [];
    try {
        places = JSON.parse('{{ places_json|escapejs }}') || [];
    } catch (e) {
        places = [];
    }

    const cityLat = parseFloat('{{ city_lat }}') || 55.7558;
    const cityLon = parseFloat('{{ city_lon }}') || 37.6173;

    const map = DG.map('map', {
        center: [cityLat, cityLon],
        zoom: 12
    });

    const MAX_DISTANCE_KM = 25; // ❗ жёсткий радиус
    const validPoints = [];

    function distanceKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;

        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    places.forEach(place => {
        const lat = parseFloat(place.lat);
        const lon = parseFloat(place.lon);

        if (isNaN(lat) || isNaN(lon)) return;

        const dist = distanceKm(cityLat, cityLon, lat, lon);

        if (dist > MAX_DISTANCE_KM) return;

        const point = [lat, lon];
        validPoints.push(point);

        DG.marker(point)
            .addTo(map)
            .bindPopup(`<b>${place.name || 'Без названия'}</b><br>${place.address || ''}`);
    });

    // 🎯 ЦЕНТРИРОВАНИЕ
    if (validPoints.length === 1) {
        map.setView(validPoints[0], 14);
    }
    else if (validPoints.length > 1) {
        map.fitBounds(validPoints, {
            padding: [40, 40],
            maxZoom: 14
        });
    }
});
</script>


{% endblock %}
